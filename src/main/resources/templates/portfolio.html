<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш портфель</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-light bg-gradient">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<div class="container">
    <nav class="navbar navbar-expand-lg bg-dark rounded" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Grow INVEST</a>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Обзор</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Инструменты</a>
                    </li>
                    <div sec:authorize="!isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                    <div sec:authorize="isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link active" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Search">
                </form>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login">
                        <button class="btn btn-outline-success me-2" type="submit">Вход</button>
                    </a>
                    <a href="/register">
                        <button class="btn btn-outline-success" type="submit">Регистрация</button>
                    </a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a class="nav-item me-2" href="/portfolio"><span sec:authentication="name">Username</span></a>
                    <a href="/logout">
                        <button class="btn btn-outline-success" type="submit">Выйти</button>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="row justify-content-md-center mt-3">
        <div class="col-6 text-center">
            <h5>Ваш портфель</h5>
        </div>
    </div>
    <div class="row d-flex justify-content-evenly mt-3">
        <div class="col-sm-2 card">
            <div class="card-body">
                <p class="card-text">Стоимость портфеля</p>
                <h5 class="card-title" th:text="${portfolio.cost} + ''"></h5>
            </div>
        </div>
        <div class="col-sm-2 card">
            <div class="card-body">
                <p class="card-text">Прогноз</p>
                <h5 class="card-title">?</h5>
            </div>
        </div>
    </div>
    <div class="row mt-4 justify-content-md-center">
        <div class="col-3">
            <h5 class="text-center">Акции</h5>
            <canvas id="stocksDoughnut"></canvas>
            <script th:inline="javascript">
                const ctx = document.getElementById('stocksDoughnut');

                const stocks = /*[[${portfolio.stocks}]]*/ [];

                const names = stocks.map(stock => stock.symbol);
                const count = stocks.map(stock => stock.count);

                // Генерируем цвета
                const backgroundColors = [
                    'rgba(255, 99, 132, 0.8)',
                    'rgba(54, 162, 235, 0.8)',
                    'rgba(255, 206, 86, 0.8)',
                    'rgba(75, 192, 192, 0.8)',
                    'rgba(153, 102, 255, 0.8)',
                    'rgba(255, 159, 64, 0.8)',
                    'rgba(199, 199, 199, 0.8)',
                    'rgba(83, 102, 255, 0.8)',
                    'rgba(255, 99, 255, 0.8)',
                    'rgba(99, 255, 132, 0.8)'
                ];

                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: names,
                        datasets: [{
                            label: names,
                            data: count,
                            backgroundColor: backgroundColors.slice(0, stocks.length),
                            borderColor: backgroundColors.map(color => color.replace('0.8', '1')),
                            hoverOffset: 10
                        }]
                    }
                });
            </script>
        </div>
        <div class="col-4">
            <table class="table">
                <thead class="table-light">
                <tr>
                    <td scope="col">Компания</td>
                    <td scope="col">Тикер</td>
                    <td scope="col">Кол&#8209;во</td>
                    <td scope="col">Общая стоимость</td>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${portfolio.stocks.empty}">
                    <td colspan="2">Вы не добавили ни одной акции.</td>
                </tr>
                <tr th:unless="${portfolio.stocks.empty}" th:each="stock : ${portfolio.stocks}">
                    <td><span th:text="${stock.shortname}"></span></td>
                    <td><span th:text="${stock.symbol}"></span></td>
                    <td><span th:text="${stock.count}"></span></td>
                    <td><span th:text="${#numbers.formatDecimal((stock.cost * stock.count), 0, 'COMMA', 2, 'POINT')} + ' ' + ${stock.wallet}"></span></td>
                </tr>
                </tbody>
            </table>
            <a href="/portfolio/edit">
                <button type="button" class="btn btn-outline-primary">Редактировать портфель</button>
            </a>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-9 text-center">
            <h5>Аналитика портфеля</h5>
            <p>Прогноз стоимости - рост</p>
            <p th:text="'Стоимость портфеля - ' + ${portfolio.cost} + ' ₽'"></p>
        </div>
    </div>
</div>
</body>
</html>
