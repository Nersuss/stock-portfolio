    <div class="row justify-content-md-center mt-3">

            <script src="https://snipp.ru/cdn/select2/4.0.13/dist/js/select2.min.js"></script>
            <script src="https://snipp.ru/cdn/select2/4.0.13/dist/js/i18n/ru.js"></script>
            <link rel="stylesheet" href="https://snipp.ru/cdn/select2/4.0.13/dist/css/select2.min.css">
            <script>
                $(document).ready(function() {
                    $('.js-select2').select2({
                        placeholder: "Поиск по акциям",
                        maximumSelectionLength: 2,
                        language: "ru",
                        ajax: {
                            url: '/api/stocks',
                            dataType: 'json',
                            delay: 350,
                            data: function (params) {
                                return {
                                    query: params.term // передаем введенный текст
                                };
                            },
                            processResults: function (data) {
                                return {
                                    results: data.map(function(stock) {
                                        return {
                                            id: stock.id,
                                            text: stock.name,
                                            url: stock.url // добавляем URL
                                        };
                                    })
                                };
                            },
                            cache: true
                        },
                        minimumInputLength: 2 // минимальная длина ввода для отправки запроса
                    }).on('select2:select', function (e) {
                        var selectedData = e.params.data;
                        window.location.href = selectedData.url;
                    });
                });
            </script>
        </div>

    <div class="row justify-content-md-center">
        <div class="col-7 justify-content-center mt-3">
            <canvas id="priceChart"></canvas>
            <script th:inline="javascript">
                /*<![CDATA[*/
                // Получаем данные из модели
                const labels = /*[[${stockLabels}]]*/ [];
                const prices = /*[[${stockPrices}]]*/ [];

                // Преобразуем цены в числа (если они пришли как строки)
                const numericPrices = prices.map(price => parseFloat(price));

                const ctx = document.getElementById('priceChart');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '[[${stockInfo.symbol}]]',
                            data: numericPrices,
                            fill: false,
                            borderColor: 'rgb(255, 60, 60)',
                            backgroundColor: 'rgba(255, 60, 60, 0.1)',
                            tension: 0.1,
                            borderWidth: 2,
                            pointRadius: 3,
                            pointBackgroundColor: 'rgb(255, 60, 60)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false,
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.1)'
                                }
                            },
                            x: {
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.1)'
                                }
                            }
                        }
                    }
                });
                /*]]>*/
            </script>
        </div>
