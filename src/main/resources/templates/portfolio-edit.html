<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ред. портфеля</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href=
            "https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://snipp.ru/cdn/select2/4.0.13/dist/css/select2.min.css">
<script src="https://code.jquery.com/jquery-3.6.1.min.js"
        integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
        crossorigin="anonymous">
</script>
<script src="https://snipp.ru/cdn/select2/4.0.13/dist/js/select2.min.js"></script>
<script src="https://snipp.ru/cdn/select2/4.0.13/dist/js/i18n/ru.js"></script>
<div class="container">
    <nav class="navbar navbar-expand-lg bg-dark rounded" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Grow INVEST</a>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Обзор</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Инструменты</a>
                    </li>
                    <div sec:authorize="!isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                    <div sec:authorize="isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Search">
                </form>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login">
                        <button class="btn btn-outline-success me-2" type="submit">Вход</button>
                    </a>
                    <a href="/register">
                        <button class="btn btn-outline-success" type="submit">Регистрация</button>
                    </a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a class="nav-item me-2" href="/portfolio" th:text="${email}"></a>
                    <a href="/logout">
                        <button class="btn btn-outline-success" type="submit">Выйти</button>
                    </a>
                </div>

            </div>
        </div>
    </nav>
    <div class="row justify-content-md-center mt-3">
        <div class="col-6">
            <h2>Редактирование портфеля</h2>
        </div>
    </div>
    <div class="row justify-content-md-center mt-3">
        <div class="col-4">
            <p>
                Выберите акцию:
            </p>
            <form th:action="@{/portfolio/stock/add}" th:object="${addStockDto}" method="post">
                <div class="mb-3">
                    <select class="form-select js-select2"></select>
                    <script>
                        $(document).ready(function() {
                            $('.js-select2').select2({
                                placeholder: "Поиск по акциям",
                                maximumSelectionLength: 2,
                                language: "ru",
                                ajax: {
                                    url: '/api/stocks',
                                    dataType: 'json',
                                    delay: 350,
                                    data: function (params) {
                                        return {
                                            query: params.term // передаем введенный текст
                                        };
                                    },
                                    processResults: function (data) {
                                        return {
                                            results: data.map(function(stock) {
                                                return {
                                                    id: stock.id,
                                                    text: stock.name,
                                                    url: stock.url // добавляем URL
                                                };
                                            })
                                        };
                                    },
                                    cache: true
                                },
                                minimumInputLength: 1 // минимальная длина ввода для отправки запроса
                            }).on('select2:select', function (e) {
                                // При выборе акции заполняем скрытые поля
                                var selectedData = e.params.data;
                                document.getElementById('stockSymbol').value = selectedData.id;    // symbol
                                document.getElementById('stockShortname').value = selectedData.text;    // symbol
                            });
                        });
                    </script>
                </div>
                <input type="hidden" id="stockSymbol" name="symbol">
                <input type="hidden" id="stockShortname" name="shortname">
                <div class="div mb-3">
                    <input name="count" id="count" placeholder="Количество акций:">
                </div>
                <button type="submit" class="btn btn-outline-success">Добавить</button>
            </form>
        </div>
    </div>
    <div class="row justify-content-md-center mt-3">
        <div class="col-6">
            <p class="center">
                Ваш портфель:
            </p>
            <table class="table">
                <thead class="table-light">
                <tr>
                    <td scope="col">Акция</td>
                    <td scope="col">Кол&#8209;во</td>
                    <td scope="col">Цена</td>
                    <td scope="col">Удалить</td>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${portfolio.stocks.empty}">
                    <td colspan="2">В вашем портфеле пока нет акций.</td>
                </tr>
                <tr th:unless="${portfolio.stocks.empty}" th:each="stock : ${portfolio.stocks}">
                    <td><span th:text="${stock.symbol}"></span></td>
                    <td><span th:text="${stock.count}"></span></td>
                    <td><span th:text="${stock.cost}"></span></td>
                    <td>
                        <form th:action="'/portfolio/stock/delete?id=' + ${stock.id}"
                              method="POST">
                            <button type="submit">❌</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
