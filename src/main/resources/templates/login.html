<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow INVEST | Вход</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<div class="container">
    <nav class="navbar navbar-expand-lg bg-dark rounded" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Grow INVEST</a>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Обзор</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Инструменты</a>
                    </li>
                    <div sec:authorize="!isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                    <div sec:authorize="isAuthenticated()">
                        <li class="nav-item">
                            <a class="nav-link" href="/portfolio">Портфель</a>
                        </li>
                    </div>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Search">
                </form>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login">
                        <button class="btn btn-outline-success me-2" type="submit">Вход</button>
                    </a>
                    <a href="/register">
                        <button class="btn btn-outline-success" type="submit">Регистрация</button>
                    </a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a class="nav-item me-2" href="/portfolio" th:text="${email}"></a>
                    <a href="/logout">
                        <button class="btn btn-outline-success" type="submit">Выйти</button>
                    </a>
                </div>

            </div>
        </div>
    </nav>
    <div class="row mt-5">
        <div class="col mt-5">
            <section class="vh-100 mt-5">
                <div class="container-fluid h-custom">
                    <div class="row d-flex justify-content-center align-items-center h-100">
                        <div class="col-md-9 col-lg-6 col-xl-5">
                            <img src="https://img.freepik.com/free-photo/female-working-environment-projects_23-2148829295.jpg?t=st=1736663128~exp=1736666728~hmac=0ec0679e691451d9aa3f02ebcc6e60cddd8ce37bda0becfa6d6b7d3347a84181&w=1380"
                                 class="img-fluid" alt="Sample image">
                        </div>
                        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                            <div th:if="${param.error}">
                                Invalid username and password.</div>
                            <form th:action="@{/login}" method="post">
                                <div data-mdb-input-init class="form-outline mb-4">
                                    <label class="form-label" for="form3Example3">Электронная почта</label>
                                    <input type="email" name="username" id="form3Example3"
                                           class="form-control form-control-lg"
                                           placeholder="Электронная почта"/>
                                </div>
                                <div data-mdb-input-init class="form-outline mb-3">
                                    <label class="form-label" for="form3Example4">Пароль</label>
                                    <input type="password" name="password" id="form3Example4"
                                           class="form-control form-control-lg"
                                           placeholder="Пароль"/>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="form-check mb-0">
                                        <input class="form-check-input me-2" name="save" type="checkbox" value=""
                                               id="form2Example3"/>
                                        <label class="form-check-label" for="form2Example3">
                                            Запомнить меня
                                        </label>
                                    </div>
                                    <a href="/help" class="text-body">Забыли пароль?</a>
                                </div>

                                <div class="text-center text-lg-start mt-4 pt-2">
                                    <button type="submit" class="btn btn-success">Войти</button>
                                    <p class="small fw-bold mt-2 pt-1 mb-0">Нет аккаунта? <a href="/register"
                                                                                             class="link-danger">Зарегистрироваться</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
</body>
</html>
