services:
  backend:
    image: stock
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stock
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_password: postgres
    ports:
      - 8080:8080
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: postgres
      POSTGRES_DB: stock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock"]
      interval: 5s
      timeout: 5s
      retries: 3